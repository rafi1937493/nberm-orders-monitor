<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Crisp Studio White) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Monitor Bezel Gradient -->
    <linearGradient id="monBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Inner Screen Gradient -->
    <linearGradient id="scrGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Amber Grip Gradient -->
    <linearGradient id="amberGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(224, 242, 254, 0.85)" />
      <stop offset="100%" stop-color="rgba(186, 230, 253, 0.95)" />
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 1. Base Squircle (Studio White) -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="4" filter="url(#softShadow)" />

  <!-- 2. Monitor Stand -->
  <rect x="232" y="355" width="48" height="50" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3" />
  <rect x="150" y="395" width="212" height="24" rx="12" fill="#e2e8f0" stroke="#0ea5e9" stroke-width="4" />

  <!-- 3. Monitor Outer Bezel -->
  <rect x="50" y="52" width="412" height="310" rx="36" fill="url(#monBezel)" stroke="#0ea5e9" stroke-width="6" />

  <!-- 4. Inner Screen -->
  <rect x="68" y="70" width="376" height="252" rx="22" fill="url(#scrGlass)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Subtle Matrix Grid Lines -->
  <line x1="70" y1="130" x2="442" y2="130" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6" />
  <line x1="70" y1="195" x2="442" y2="195" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6" />
  <line x1="70" y1="260" x2="442" y2="260" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6" />

  <!-- 5. Document on Left -->
  <g id="document">
    <path d="M 90 102 L 90 250 L 208 250 L 208 122 L 178 92 L 100 92 Z" fill="#ffffff" stroke="#0ea5e9" stroke-width="5" />
    <polygon points="178,92 208,122 178,122" fill="#0ea5e9" />
    <line x1="108" y1="144" x2="155" y2="144" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
    <line x1="108" y1="172" x2="185" y2="172" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    <line x1="108" y1="200" x2="178" y2="200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="108" y1="226" x2="152" y2="226" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 6. Multi-colored Analytics Bars on Right -->
  <g id="bars">
    <rect x="242" y="235" width="26" height="72" rx="13" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
    <rect x="285" y="185" width="28" height="122" rx="14" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <rect x="330" y="205" width="28" height="102" rx="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <rect x="375" y="140" width="30" height="167" rx="15" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- 7. Upward Trend Line -->
  <g id="trendline">
    <polyline points="240,155 290,112 350,138 410,86" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="240" cy="155" r="9" fill="#f43f5e" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="290" cy="112" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="350" cy="138" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="410" cy="86" r="11" fill="#0ea5e9" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- 8. Foreground Magnifying Glass with Verified Checkmark -->
  <g id="magnifier">
    <!-- Amber Handle -->
    <polygon points="135,390 55,470 75,490 155,410" fill="url(#amberGrip)" stroke="#1e293b" stroke-width="5" />
    <circle cx="64" cy="479" r="12" fill="#0ea5e9" stroke="#1e293b" stroke-width="4" />

    <!-- Lens Glass & Frame -->
    <circle cx="175" cy="335" r="84" fill="url(#lensGlass)" stroke="#0284c7" stroke-width="14" />
    <circle cx="175" cy="335" r="76" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" />

    <!-- Bold Verified Green Checkmark -->
    <polyline points="141,333 167,363 213,303" fill="none" stroke="#10b981" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="141,333 167,363 213,303" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
