<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#070c17" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="brandBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="monBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="scrGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="100%" stop-color="#08101e" />
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.45)" />
      <stop offset="60%" stop-color="rgba(14, 165, 233, 0.25)" />
      <stop offset="100%" stop-color="rgba(3, 105, 161, 0.55)" />
    </linearGradient>
    <linearGradient id="amberGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#brandBg)" />
  <rect x="3" y="3" width="506" height="506" rx="114" fill="none" stroke="url(#brandBorder)" stroke-width="6" opacity="0.85" />

  <!-- Stand Base & Neck -->
  <rect x="230" y="340" width="52" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <path d="M 140 405 L 372 405 C 390 405 400 420 390 435 C 380 445 365 448 350 448 L 162 448 C 147 448 132 445 122 435 C 112 420 122 405 140 405 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />

  <!-- Monitor Outer Bezel -->
  <rect x="42" y="44" width="428" height="308" rx="36" fill="url(#monBezel)" stroke="#38bdf8" stroke-width="6" />

  <!-- Inner Screen Glass -->
  <rect x="62" y="64" width="388" height="252" rx="22" fill="url(#scrGlass)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Screen Subtle Matrix Grid Lines -->
  <line x1="62" y1="127" x2="450" y2="127" stroke="rgba(56, 189, 248, 0.08)" stroke-dasharray="4 6" />
  <line x1="62" y1="190" x2="450" y2="190" stroke="rgba(56, 189, 248, 0.08)" stroke-dasharray="4 6" />
  <line x1="62" y1="253" x2="450" y2="253" stroke="rgba(56, 189, 248, 0.08)" stroke-dasharray="4 6" />

  <!-- Document on Left -->
  <g transform="translate(86, 85)">
    <path d="M 0 8 C 0 3.6 3.6 0 8 0 L 82 0 L 115 33 L 115 146 C 115 150.4 111.4 154 107 154 L 8 154 C 3.6 154 0 150.4 0 146 Z" fill="#0c1524" stroke="#38bdf8" stroke-width="5" />
    <path d="M 82 0 L 115 33 L 86 33 C 83.8 33 82 31.2 82 29 Z" fill="#38bdf8" />
    <line x1="20" y1="52" x2="68" y2="52" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <line x1="20" y1="78" x2="95" y2="78" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
    <line x1="20" y1="104" x2="90" y2="104" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
    <line x1="20" y1="130" x2="65" y2="130" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Line Graph on Right -->
  <g>
    <path d="M 235 155 L 285 110 L 345 138 L 405 85" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 235 155 L 285 110 L 345 138 L 405 85" fill="none" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" filter="url(#logoGlow)" />
    
    <circle cx="235" cy="155" r="9" fill="#f43f5e" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="285" cy="110" r="10" fill="#2dd4bf" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="345" cy="138" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="405" cy="85" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Bar Charts on Right -->
  <g>
    <rect x="238" y="228" width="24" height="68" rx="6" fill="#f43f5e" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <rect x="278" y="180" width="26" height="116" rx="6" fill="#10b981" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <rect x="320" y="200" width="26" height="96" rx="6" fill="#fbbf24" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <rect x="362" y="135" width="28" height="161" rx="6" fill="#38bdf8" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  </g>

  <!-- Foreground Magnifying Glass with Verified Checkmark -->
  <!-- Handle -->
  <g transform="translate(15, 15)">
    <path d="M 120 375 L 45 450 C 37 458 37 470 45 478 C 53 486 65 486 73 478 L 148 403 Z" fill="url(#amberGrip)" stroke="#1e293b" stroke-width="6" />
    <circle cx="128" cy="383" r="12" fill="#38bdf8" stroke="#1e293b" stroke-width="4" />
  </g>

  <!-- Lens Frame & Glass -->
  <circle cx="165" cy="325" r="82" fill="url(#lensGlass)" stroke="#38bdf8" stroke-width="14" filter="url(#logoGlow)" />
  <circle cx="165" cy="325" r="82" fill="url(#lensGlass)" stroke="#0284c7" stroke-width="12" />
  <circle cx="165" cy="325" r="74" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" />

  <!-- Bold Checkmark Inside Lens -->
  <path d="M 132 322 L 158 350 L 202 296" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 132 322 L 158 350 L 202 296" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
